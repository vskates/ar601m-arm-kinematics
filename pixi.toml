[workspace]
name = "ar601m-arm-kinematics"
version = "0.1.0"
description = "Six-joint arm kinematics, IK, Jacobian and singularity analysis"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.11.*"
pytest = "*"
numpy = "*"
scipy = "*"
matplotlib = "*"

[tasks]
check = "python reproduce.py"
